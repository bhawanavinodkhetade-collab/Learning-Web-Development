<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Simple Website</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            text-align: center;
        }

        header {
            margin-bottom: 30px;
        }

        h1 {
            color: #333;
        }

        p {
            color: #666;
            font-size: 1.1rem;
        }

        .links-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-width: 300px;
            margin: 0 auto;
        }

        .link-button {
            display: block;
            padding: 12px 20px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            transition: background-color 0.3s ease;
        }

        .link-button:hover {
            background-color: #0056b3;
        }

        /* Custom colors for each platform */
        .google {
            background-color: #4285F4;
        }

        .google:hover {
            background-color: #357ae8;
        }

        .facebook {
            background-color: #1877F2;
        }

        .facebook:hover {
            background-color: #166fe5;
        }

        .instagram {
            background-color: #E4405F;
        }

        .instagram:hover {
            background-color: #d62e4c;
        }
    </style>
</head>

<body>

    <header>
        <h1>Welcome to My Website</h1>
        <p>Click any of the links below to visit popular platforms:</p>
    </header>

    <main>
        <div class="links-container">
            <a href="https://www.google.com" target="_blank" rel="noopener noreferrer"
                class="link-button google">Google</a>
            <a href="https://www.facebook.com" target="_blank" rel="noopener noreferrer"
                class="link-button facebook">Facebook</a>
            <a href="https://www.instagram.com" target="_blank" rel="noopener noreferrer"
                class="link-button instagram">Instagram</a>
        </div>
    </main>

</body>

</html>
