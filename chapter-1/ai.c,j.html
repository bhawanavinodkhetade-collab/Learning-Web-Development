<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Simple Website with Clock</title>
    <!-- Tailwind CSS CDN for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between items-center">

    <!-- Header Section with Clock -->
    <header class="w-full bg-slate-800 border-b border-slate-700 py-6 px-4 shadow-lg text-center">
        <div class="max-w-4xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-2xl font-bold tracking-tight text-white">Welcome Portal</h1>
                <p class="text-xs text-slate-400 mt-1">Quick access to popular platforms</p>
            </div>
            
            <!-- Real-Time Digital Clock -->
            <div class="bg-slate-950/80 px-5 py-2.5 rounded-xl border border-slate-700 shadow-inner flex items-center gap-3">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-indigo-400 animate-pulse" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
                <div class="text-right">
                    <div id="live-clock" class="text-xl font-mono font-bold text-indigo-300 tracking-wider">00:00:00 AM</div>
                    <div id="live-date" class="text-[10px] uppercase font-semibold text-slate-400 tracking-widest">Jan 01, 2026</div>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-grow flex flex-col items-center justify-center p-6 w-full max-w-md">
        <div class="w-full bg-slate-800/50 p-6 rounded-2xl border border-slate-700/60 backdrop-blur shadow-xl">
            <h2 class="text-lg font-semibold text-slate-200 mb-4 text-center">External Navigation</h2>
            <div class="space-y-3.5">
                
                <!-- Google Button -->
                <a href="https://www.google.com" target="_blank" rel="noopener noreferrer" 
                   class="flex items-center justify-between p-3.5 bg-slate-700/40 hover:bg-slate-700/80 border border-slate-600/50 hover:border-blue-500/50 rounded-xl transition-all duration-200 group">
                    <div class="flex items-center space-x-3">
                        <div class="p-2 bg-slate-800 rounded-lg group-hover:bg-blue-500/10 transition-colors">
                            <svg class="w-5 h-5 fill-current text-slate-300 group-hover:text-blue-400" viewBox="0 0 24 24">
                                <path d="M12.48 10.92v3.28h7.84c-.24 1.84-.853 3.187-1.787 4.133-1.147 1.147-2.933 2.4-6.053 2.4-4.827 0-8.6-3.893-8.6-8.72s3.773-8.72 8.6-8.72c2.6 0 4.507 1.027 5.907 2.347l2.307-2.307C18.747 1.44 16.133 0 12.48 0 5.867 0 .307 5.387.307 12s5.56 12 12.173 12c3.573 0 6.267-1.173 8.373-3.36 2.16-2.16 2.84-5.213 2.84-7.667 0-.76-.053-1.467-.173-2.053H12.48z"/>
                            </svg>
                        </div>
                        <span class="font-medium text-slate-200 group-hover:text-white">Google</span>
                    </div>
                    <span class="text-xs text-slate-400 group-hover:text-blue-400 transition-colors">Search &rarr;</span>
                </a>

                <!-- Facebook Button -->
                <a href="https://www.facebook.com" target="_blank" rel="noopener noreferrer" 
                   class="flex items-center justify-between p-3.5 bg-slate-700/40 hover:bg-slate-700/80 border border-slate-600/50 hover:border-blue-600/50 rounded-xl transition-all duration-200 group">
                    <div class="flex items-center space-x-3">
                        <div class="p-2 bg-slate-800 rounded-lg group-hover:bg-blue-600/10 transition-colors">
                            <svg class="w-5 h-5 fill-current text-slate-300 group-hover:text-blue-500" viewBox="0 0 24 24">
                                <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
                            </svg>
                        </div>
                        <span class="font-medium text-slate-200 group-hover:text-white">Facebook</span>
                    </div>
                    <span class="text-xs text-slate-400 group-hover:text-blue-500 transition-colors">Connect &rarr;</span>
                </a>

                <!-- Instagram Button -->
                <a href="https://www.instagram.com" target="_blank" rel="noopener noreferrer" 
                   class="flex items-center justify-between p-3.5 bg-slate-700/40 hover:bg-slate-700/80 border border-slate-600/50 hover:border-pink-500/50 rounded-xl transition-all duration-200 group">
                    <div class="flex items-center space-x-3">
                        <div class="p-2 bg-slate-800 rounded-lg group-hover:bg-pink-500/10 transition-colors">
                            <svg class="w-5 h-5 fill-current text-slate-300 group-hover:text-pink-400" viewBox="0 0 24 24">
                                <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/>
                            </svg>
                        </div>
                        <span class="font-medium text-slate-200 group-hover:text-white">Instagram</span>
                    </div>
                    <span class="text-xs text-slate-400 group-hover:text-pink-400 transition-colors">Explore &rarr;</span>
                </a>

            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="w-full py-4 text-center text-xs text-slate-500 border-t border-slate-800">
        &copy; Simple Navigation Portal with Real-Time Clock
    </footer>

    <!-- Clock Logic Script -->
    <script>
        function updateClock() {
            const now = new Date();
            
            // Format time: HH:MM:SS AM/PM
            let hours = now.getHours();
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            const ampm = hours >= 12 ? 'PM' : 'AM';
            
            hours = hours % 12;
            hours = hours ? hours : 12; // 0 should be 12
            const timeString = `${String(hours).padStart(2, '0')}:${minutes}:${seconds} ${ampm}`;
            
            // Format date: Day, Month DD, YYYY
            const options = { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' };
            const dateString = now.toLocaleDateString('en-US', options);
            
            // Update HTML elements
            document.getElementById('live-clock').textContent = timeString;
            document.getElementById('live-date').textContent = dateString;
        }

        // Initialize clock immediately and update every second
        updateClock();
        setInterval(updateClock, 1000);
    </script>
</body>
</html>
